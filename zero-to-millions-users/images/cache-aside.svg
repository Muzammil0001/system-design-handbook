<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Cache aside pattern: check cache, read database on a miss, store result in cache">
<title>Cache aside pattern: check cache, read database on a miss, store result in cache</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="430" fill="#FFFFFF"/>
<rect x="30" y="170" width="150" height="80" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="105.0" y="215.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Web server</text>
<circle cx="174" cy="172" r="17" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
<g transform="translate(174,172) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-11" width="20" height="9" rx="2"/><rect x="-10" y="2" width="20" height="9" rx="2"/><circle cx="-5" cy="-6.5" r="1" class="d"/><circle cx="-5" cy="6.5" r="1" class="d"/><line x1="1" y1="-6.5" x2="7" y2="-6.5"/><line x1="1" y1="6.5" x2="7" y2="6.5"/></g>
<rect x="380" y="60" width="170" height="80" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<text x="465.0" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Cache</text>
<text x="465.0" y="115.0" text-anchor="middle" font-size="12" fill="#4B5563">in memory</text>
<circle cx="544" cy="62" r="17" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
<g transform="translate(544,62) scale(0.85)" fill="none" stroke="#DB2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="2,-11 -7,2 -1,2 -2,11 7,-2 1,-2"/></g>
<rect x="380" y="250" width="170" height="80" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="465.0" y="286.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Database</text>
<text x="465.0" y="305.0" text-anchor="middle" font-size="12" fill="#4B5563">source of truth</text>
<circle cx="544" cy="252" r="17" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
<g transform="translate(544,252) scale(0.85)" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="9" ry="3.5"/><path d="M-9,-8 V8 A9,3.5 0 0 0 9,8 V-8"/><path d="M-9,0 A9,3.5 0 0 0 9,0"/></g>
<polyline points="180,190 280,190 280,100 380,100" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="280" cy="145" r="12" fill="#111827"/><text x="280" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<polyline points="180,230 280,230 280,290 380,290" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="280" cy="260" r="12" fill="#111827"/><text x="280" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<polyline points="105,170 105,30 465,30 465,60" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<circle cx="285" cy="30" r="12" fill="#111827"/><text x="285" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="30" y="365" text-anchor="start" font-size="13" fill="#4B5563">1  Check the cache first. A hit returns immediately.</text>
<text x="30" y="388" text-anchor="start" font-size="13" fill="#4B5563">2  On a miss, read the database.</text>
<text x="30" y="411" text-anchor="start" font-size="13" fill="#4B5563">3  Store the result in the cache with a TTL so later reads are fast.</text>
</svg>
