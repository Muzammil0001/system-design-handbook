<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Single server setup: client resolves DNS, then calls one server running web app, database and cache">
<title>Single server setup: client resolves DNS, then calls one server running web app, database and cache</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="300" fill="#FFFFFF"/>
<rect x="30" y="110" width="150" height="70" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="105.0" y="141.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Client</text>
<text x="105.0" y="160.0" text-anchor="middle" font-size="12" fill="#4B5563">Browser / mobile app</text>
<circle cx="174" cy="112" r="17" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<g transform="translate(174,112) scale(0.85)" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-9" width="22" height="14" rx="2"/><line x1="-5" y1="10" x2="5" y2="10"/><line x1="0" y1="5" x2="0" y2="10"/></g>
<rect x="330" y="20" width="150" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="405.0" y="46.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">DNS</text>
<text x="405.0" y="65.0" text-anchor="middle" font-size="12" fill="#4B5563">domain to IP</text>
<circle cx="474" cy="22" r="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<g transform="translate(474,22) scale(0.85)" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="10"/><ellipse cx="0" cy="0" rx="4.5" ry="10"/><line x1="-10" y1="0" x2="10" y2="0"/></g>
<rect x="520" y="60" width="250" height="200" rx="14" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="7 5"/>
<text x="534" y="82" font-size="13" font-weight="700" fill="#16A34A">Single server</text>
<rect x="545" y="90" width="200" height="44" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="645.0" y="117.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Web app</text>
<circle cx="739" cy="92" r="17" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
<g transform="translate(739,92) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-11" width="20" height="9" rx="2"/><rect x="-10" y="2" width="20" height="9" rx="2"/><circle cx="-5" cy="-6.5" r="1" class="d"/><circle cx="-5" cy="6.5" r="1" class="d"/><line x1="1" y1="-6.5" x2="7" y2="-6.5"/><line x1="1" y1="6.5" x2="7" y2="6.5"/></g>
<rect x="545" y="142" width="200" height="44" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="645.0" y="169.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Database</text>
<circle cx="739" cy="144" r="17" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
<g transform="translate(739,144) scale(0.85)" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="9" ry="3.5"/><path d="M-9,-8 V8 A9,3.5 0 0 0 9,8 V-8"/><path d="M-9,0 A9,3.5 0 0 0 9,0"/></g>
<rect x="545" y="194" width="200" height="44" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<text x="645.0" y="221.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Cache</text>
<circle cx="739" cy="196" r="17" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
<g transform="translate(739,196) scale(0.85)" fill="none" stroke="#DB2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="2,-11 -7,2 -1,2 -2,11 7,-2 1,-2"/></g>
<polyline points="180,125 255,125 255,50 330,50" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="255" cy="88" r="12" fill="#111827"/><text x="255" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<polyline points="180,150 520,150" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="350" cy="150" r="12" fill="#111827"/><text x="350" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<polyline points="520,175 180,175" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<circle cx="350" cy="175" r="12" fill="#111827"/><text x="350" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="30" y="235" text-anchor="start" font-size="13" fill="#4B5563">1  Resolve the domain to an IP address</text>
<text x="30" y="255" text-anchor="start" font-size="13" fill="#4B5563">2  Send the HTTP request</text>
<text x="30" y="275" text-anchor="start" font-size="13" fill="#4B5563">3  Receive HTML or JSON</text>
</svg>
