<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Shard router sending requests to three database shards by user id">
<title>Shard router sending requests to three database shards by user id</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="380" fill="#FFFFFF"/>
<rect x="30" y="155" width="130" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="95.0" y="195.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Web tier</text>
<circle cx="154" cy="157" r="17" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
<g transform="translate(154,157) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-11" width="20" height="9" rx="2"/><rect x="-10" y="2" width="20" height="9" rx="2"/><circle cx="-5" cy="-6.5" r="1" class="d"/><circle cx="-5" cy="6.5" r="1" class="d"/><line x1="1" y1="-6.5" x2="7" y2="-6.5"/><line x1="1" y1="6.5" x2="7" y2="6.5"/></g>
<rect x="240" y="155" width="170" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="325.0" y="186.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Shard router</text>
<text x="325.0" y="205.0" text-anchor="middle" font-size="12" fill="#4B5563">hash(user_id) % 3</text>
<circle cx="404" cy="157" r="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<g transform="translate(404,157) scale(0.85)" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="0" r="2.5"/><circle cx="8" cy="-8" r="2.5"/><circle cx="8" cy="0" r="2.5"/><circle cx="8" cy="8" r="2.5"/><line x1="-5.5" y1="0" x2="5.5" y2="0"/><path d="M-5.5,0 L5.5,-8 M-5.5,0 L5.5,8"/></g>
<rect x="540" y="30" width="230" height="80" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="655.0" y="66.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Shard 0</text>
<text x="655.0" y="85.0" text-anchor="middle" font-size="12" fill="#4B5563">users where id % 3 = 0</text>
<circle cx="764" cy="32" r="17" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
<g transform="translate(764,32) scale(0.85)" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="9" ry="3.5"/><path d="M-9,-8 V8 A9,3.5 0 0 0 9,8 V-8"/><path d="M-9,0 A9,3.5 0 0 0 9,0"/></g>
<rect x="540" y="150" width="230" height="80" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="655.0" y="186.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Shard 1</text>
<text x="655.0" y="205.0" text-anchor="middle" font-size="12" fill="#4B5563">users where id % 3 = 1</text>
<circle cx="764" cy="152" r="17" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
<g transform="translate(764,152) scale(0.85)" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="9" ry="3.5"/><path d="M-9,-8 V8 A9,3.5 0 0 0 9,8 V-8"/><path d="M-9,0 A9,3.5 0 0 0 9,0"/></g>
<rect x="540" y="270" width="230" height="80" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="655.0" y="306.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Shard 2</text>
<text x="655.0" y="325.0" text-anchor="middle" font-size="12" fill="#4B5563">users where id % 3 = 2</text>
<circle cx="764" cy="272" r="17" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
<g transform="translate(764,272) scale(0.85)" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="9" ry="3.5"/><path d="M-9,-8 V8 A9,3.5 0 0 0 9,8 V-8"/><path d="M-9,0 A9,3.5 0 0 0 9,0"/></g>
<polyline points="160,190 240,190" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="410,190 475,190 475,70 540,70" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="410,190 540,190" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="410,190 475,190 475,310 540,310" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="400" y="365" text-anchor="middle" font-size="13" fill="#4B5563">Each shard owns part of the data and has its own replicas</text>
</svg>
