<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Web tier and data tier running on separate servers">
