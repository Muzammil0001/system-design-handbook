<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="CDN edge serving static content and fetching from origin on a cache miss">
<title>CDN edge serving static content and fetching from origin on a cache miss</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="300" fill="#FFFFFF"/>
<rect x="30" y="100" width="130" height="80" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="95.0" y="145.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">User</text>
<circle cx="154" cy="102" r="17" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<g transform="translate(154,102) scale(0.85)" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-9" width="22" height="14" rx="2"/><line x1="-5" y1="10" x2="5" y2="10"/><line x1="0" y1="5" x2="0" y2="10"/></g>
<rect x="330" y="100" width="150" height="80" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="405.0" y="136.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">CDN edge</text>
<text x="405.0" y="155.0" text-anchor="middle" font-size="12" fill="#4B5563">nearest location</text>
<circle cx="474" cy="102" r="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<g transform="translate(474,102) scale(0.85)" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-7" r="3"/><circle cx="-8" cy="7" r="3"/><circle cx="8" cy="7" r="3"/><path d="M-1.5,-4.5 L-6.5,4.5 M1.5,-4.5 L6.5,4.5 M-5,7 H5"/></g>
<rect x="630" y="100" width="140" height="80" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="700.0" y="136.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Origin</text>
<text x="700.0" y="155.0" text-anchor="middle" font-size="12" fill="#4B5563">servers / storage</text>
<circle cx="764" cy="102" r="17" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
<g transform="translate(764,102) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-11" width="20" height="9" rx="2"/><rect x="-10" y="2" width="20" height="9" rx="2"/><circle cx="-5" cy="-6.5" r="1" class="d"/><circle cx="-5" cy="6.5" r="1" class="d"/><line x1="1" y1="-6.5" x2="7" y2="-6.5"/><line x1="1" y1="6.5" x2="7" y2="6.5"/></g>
<polyline points="160,125 330,125" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="245" cy="125" r="12" fill="#111827"/><text x="245" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<polyline points="330,158 160,158" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<circle cx="245" cy="158" r="12" fill="#111827"/><text x="245" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<polyline points="480,125 630,125" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="555" cy="125" r="12" fill="#111827"/><text x="555" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<polyline points="630,158 480,158" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<circle cx="555" cy="158" r="12" fill="#111827"/><text x="555" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="30" y="240" text-anchor="start" font-size="13" fill="#4B5563">1 User asks the nearest edge.   2 On a miss, the edge asks the origin.</text>
<text x="30" y="262" text-anchor="start" font-size="13" fill="#4B5563">3 Origin responds and the edge keeps a copy.   4 Later requests are served from the edge.</text>
</svg>
