<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Two data centers with GeoDNS routing and data replication between them">
<title>Two data centers with GeoDNS routing and data replication between them</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="440" fill="#FFFFFF"/>
