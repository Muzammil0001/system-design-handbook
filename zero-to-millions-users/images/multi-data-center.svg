<polyline points="335,205 385,205 385,100 440,100" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="335,225 385,225 385,350 440,350" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="590,100 620,100" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="590,350 620,350" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="685,140 685,310" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="625.24" y="214.0" width="119.52000000000001" height="22" rx="4" fill="#FFFFFF"/>
<text x="685" y="229.0" text-anchor="middle" font-size="12" fill="#111827">data replication</text>
<text x="30" y="300" text-anchor="start" font-size="13" fill="#4B5563">DNS routing sends each user</text>
<text x="30" y="320" text-anchor="start" font-size="13" fill="#4B5563">to a nearby healthy</text>
<text x="30" y="340" text-anchor="start" font-size="13" fill="#4B5563">data center.</text>
