<rect x="620" y="60" width="130" height="80" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="685.0" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Database</text>
<text x="685.0" y="115.0" text-anchor="middle" font-size="12" fill="#4B5563">primary</text>
