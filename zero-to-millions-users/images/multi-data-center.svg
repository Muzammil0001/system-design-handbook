<g transform="translate(744,62) scale(0.85)" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="9" ry="3.5"/><path d="M-9,-8 V8 A9,3.5 0 0 0 9,8 V-8"/><path d="M-9,0 A9,3.5 0 0 0 9,0"/></g>
