<text x="454" y="292" font-size="13" font-weight="700" fill="#16A34A">Data center B (serves EU users)</text>
<rect x="460" y="310" width="130" height="80" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="525.0" y="355.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Web tier</text>
