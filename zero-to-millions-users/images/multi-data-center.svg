<g transform="translate(144,182) scale(0.85)" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-5" r="4.5"/><path d="M-9,10 A9,8 0 0 1 9,10"/></g>
