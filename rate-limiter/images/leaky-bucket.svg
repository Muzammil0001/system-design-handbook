<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Leaky bucket: requests wait in a fixed size queue and are processed at a constant rate, overflow is dropped">
<title>Leaky bucket: requests wait in a fixed size queue and are processed at a constant rate, overflow is dropped</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="360" fill="#FFFFFF"/>
<rect x="310" y="20" width="180" height="56" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="400.0" y="44.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Dropped</text>
<text x="400.0" y="63.0" text-anchor="middle" font-size="12" fill="#4B5563">HTTP 429</text>
<circle cx="484" cy="22" r="17" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
<g transform="translate(484,22) scale(0.85)" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="10"/><line x1="-7" y1="7" x2="7" y2="-7"/></g>
<rect x="30" y="170" width="130" height="70" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="95.0" y="210.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Requests</text>
<circle cx="154" cy="172" r="17" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<g transform="translate(154,172) scale(0.85)" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-9" width="22" height="14" rx="2"/><line x1="-5" y1="10" x2="5" y2="10"/><line x1="0" y1="5" x2="0" y2="10"/></g>
<rect x="290" y="110" width="220" height="170" rx="14" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 5"/>
<text x="304" y="132" font-size="13" font-weight="700" fill="#7C3AED">Queue (fixed size)</text>
<rect x="310" y="190" width="38" height="50" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="0"/>
<rect x="357" y="190" width="38" height="50" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="0"/>
<rect x="404" y="190" width="38" height="50" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="0"/>
<rect x="451" y="190" width="38" height="50" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="640" y="170" width="130" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="705.0" y="210.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">API server</text>
<circle cx="764" cy="172" r="17" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
<g transform="translate(764,172) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-11" width="20" height="9" rx="2"/><rect x="-10" y="2" width="20" height="9" rx="2"/><circle cx="-5" cy="-6.5" r="1" class="d"/><circle cx="-5" cy="6.5" r="1" class="d"/><line x1="1" y1="-6.5" x2="7" y2="-6.5"/><line x1="1" y1="6.5" x2="7" y2="6.5"/></g>
<polyline points="160,205 290,205" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="195.48" y="177.0" width="59.040000000000006" height="22" rx="4" fill="#FFFFFF"/>
<text x="225" y="192.0" text-anchor="middle" font-size="12" fill="#111827">enqueue</text>
<polyline points="510,205 640,205" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="535.4" y="177.0" width="79.2" height="22" rx="4" fill="#FFFFFF"/>
<text x="575" y="192.0" text-anchor="middle" font-size="12" fill="#111827">fixed rate</text>
<polyline points="400,110 400,76" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
