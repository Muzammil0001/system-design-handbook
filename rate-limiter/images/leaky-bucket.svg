<text x="450" y="97.0" text-anchor="middle" font-size="12" fill="#111827">queue full</text>
<text x="30" y="320" text-anchor="start" font-size="13" fill="#4B5563">Requests leave the queue at a constant rate, so bursts are smoothed into a steady flow.</text>
