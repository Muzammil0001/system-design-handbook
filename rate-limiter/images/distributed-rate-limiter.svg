<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Several rate limiter nodes sharing one Redis counter store with an atomic script and a replica">
<title>Several rate limiter nodes sharing one Redis counter store with an atomic script and a replica</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="420" fill="#FFFFFF"/>
<rect x="30" y="50" width="170" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="115.0" y="90.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Limiter node 1</text>
<circle cx="194" cy="52" r="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<g transform="translate(194,52) scale(0.85)" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-11 L9,-7 V0 C9,6 5,9 0,11 C-5,9 -9,6 -9,0 V-7 Z"/><path d="M-4,0 L-1,3 L5,-4"/></g>
<rect x="30" y="175" width="170" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="115.0" y="215.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Limiter node 2</text>
<circle cx="194" cy="177" r="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<g transform="translate(194,177) scale(0.85)" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-11 L9,-7 V0 C9,6 5,9 0,11 C-5,9 -9,6 -9,0 V-7 Z"/><path d="M-4,0 L-1,3 L5,-4"/></g>
<rect x="30" y="300" width="170" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="115.0" y="340.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Limiter node 3</text>
<circle cx="194" cy="302" r="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<g transform="translate(194,302) scale(0.85)" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-11 L9,-7 V0 C9,6 5,9 0,11 C-5,9 -9,6 -9,0 V-7 Z"/><path d="M-4,0 L-1,3 L5,-4"/></g>
<rect x="330" y="100" width="260" height="230" rx="14" fill="none" stroke="#DB2777" stroke-width="2" stroke-dasharray="7 5"/>
<text x="344" y="122" font-size="13" font-weight="700" fill="#DB2777">Shared counter store</text>
<rect x="360" y="145" width="200" height="80" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<text x="460.0" y="181.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Redis primary</text>
<text x="460.0" y="200.0" text-anchor="middle" font-size="12" fill="#4B5563">atomic Lua script</text>
<circle cx="554" cy="147" r="17" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
<g transform="translate(554,147) scale(0.85)" fill="none" stroke="#DB2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="2,-11 -7,2 -1,2 -2,11 7,-2 1,-2"/></g>
<rect x="360" y="245" width="200" height="60" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<text x="460.0" y="280.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Redis replica</text>
<circle cx="554" cy="247" r="17" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
<g transform="translate(554,247) scale(0.85)" fill="none" stroke="#DB2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="9" ry="3.5"/><path d="M-9,-8 V8 A9,3.5 0 0 0 9,8 V-8"/><path d="M-9,0 A9,3.5 0 0 0 9,0"/></g>
<polyline points="200,85 265,85 265,210" fill="none" stroke="#374151" stroke-width="2"/>
<polyline points="200,210 265,210" fill="none" stroke="#374151" stroke-width="2"/>
<polyline points="200,335 265,335 265,210" fill="none" stroke="#374151" stroke-width="2"/>
<polyline points="265,210 330,210" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="460,225 460,245" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="640" y="185" text-anchor="start" font-size="13" fill="#4B5563">All nodes read and update</text>
<text x="640" y="205" text-anchor="start" font-size="13" fill="#4B5563">the same counters, so the</text>
<text x="640" y="225" text-anchor="start" font-size="13" fill="#4B5563">limit holds across servers.</text>
<text x="30" y="405" text-anchor="start" font-size="13" fill="#4B5563">The script reads the counter, decides, and updates it in one atomic step.</text>
</svg>
