<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Sliding window counter: estimate requests in the rolling window from the current and previous fixed window counts">
<title>Sliding window counter: estimate requests in the rolling window from the current and previous fixed window counts</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="380" fill="#FFFFFF"/>
<rect x="60" y="90" width="340" height="90" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<rect x="400" y="90" width="340" height="90" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="230" y="118" text-anchor="middle" font-size="13" fill="#111827" font-weight="700">Previous window</text>
<text x="230" y="140" text-anchor="middle" font-size="13" fill="#4B5563">5 requests</text>
<text x="570" y="118" text-anchor="middle" font-size="13" fill="#111827" font-weight="700">Current window</text>
<text x="570" y="140" text-anchor="middle" font-size="13" fill="#4B5563">3 requests so far</text>
<rect x="162" y="205" width="340" height="44" rx="8" fill="#DBEAFE" fill-opacity="0.7" stroke="#2563EB" stroke-width="2"/>
<text x="332" y="232" text-anchor="middle" font-size="13" fill="#111827" font-weight="700">Rolling 60 second window</text>
<line x1="502" y1="75" x2="502" y2="265" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="398.56" y="51.0" width="206.88000000000002" height="22" rx="4" fill="#FFFFFF"/>
<text x="502" y="66.0" text-anchor="middle" font-size="12" fill="#111827">now (30% into current window)</text>
<rect x="162" y="150" width="238" height="26" fill="#DBEAFE"/>
<text x="281" y="168" text-anchor="middle" font-size="12" fill="#111827">70% overlap with the rolling window</text>
<rect x="30" y="290" width="740" height="56" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
<text x="400" y="314" text-anchor="middle" font-size="13" fill="#111827" font-weight="700">Estimated count = current + previous x overlap</text>
<text x="400" y="334" text-anchor="middle" font-size="13" fill="#4B5563">3 + 5 x 0.7 = 6.5 estimated requests. A limit of 6 rejects the next request, a limit of 7 allows it.</text>
</svg>
