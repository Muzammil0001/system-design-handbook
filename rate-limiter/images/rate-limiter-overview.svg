<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Rate limiter middleware between client and API servers, using a rules store and a counter store">
<title>Rate limiter middleware between client and API servers, using a rules store and a counter store</title>
<defs><style>.d{fill:#374151;stroke:none}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="450" fill="#FFFFFF"/>
<rect x="30" y="160" width="130" height="70" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="95.0" y="200.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Client</text>
<circle cx="154" cy="162" r="17" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<g transform="translate(154,162) scale(0.85)" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-9" width="22" height="14" rx="2"/><line x1="-5" y1="10" x2="5" y2="10"/><line x1="0" y1="5" x2="0" y2="10"/></g>
<rect x="260" y="150" width="170" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="345.0" y="191.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Rate limiter</text>
<text x="345.0" y="210.0" text-anchor="middle" font-size="12" fill="#4B5563">middleware or gateway</text>
<circle cx="424" cy="152" r="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<g transform="translate(424,152) scale(0.85)" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-11 L9,-7 V0 C9,6 5,9 0,11 C-5,9 -9,6 -9,0 V-7 Z"/><path d="M-4,0 L-1,3 L5,-4"/></g>
<rect x="640" y="160" width="130" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="705.0" y="200.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">API servers</text>
<circle cx="764" cy="162" r="17" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
<g transform="translate(764,162) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-11" width="20" height="9" rx="2"/><rect x="-10" y="2" width="20" height="9" rx="2"/><circle cx="-5" cy="-6.5" r="1" class="d"/><circle cx="-5" cy="6.5" r="1" class="d"/><line x1="1" y1="-6.5" x2="7" y2="-6.5"/><line x1="1" y1="6.5" x2="7" y2="6.5"/></g>
<rect x="130" y="340" width="170" height="70" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
<text x="215.0" y="371.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Rules store</text>
<text x="215.0" y="390.0" text-anchor="middle" font-size="12" fill="#4B5563">limits per API / user</text>
<circle cx="294" cy="342" r="17" fill="#FFFFFF" stroke="#CA8A04" stroke-width="2"/>
<g transform="translate(294,342) scale(0.85)" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-7,-11 H3 L8,-6 V11 H-7 Z"/><path d="M3,-11 V-6 H8"/><line x1="-3" y1="1" x2="4" y2="1"/><line x1="-3" y1="5" x2="4" y2="5"/></g>
<rect x="400" y="340" width="170" height="70" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<text x="485.0" y="371.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Counter store</text>
<text x="485.0" y="390.0" text-anchor="middle" font-size="12" fill="#4B5563">Redis</text>
<circle cx="564" cy="342" r="17" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
<g transform="translate(564,342) scale(0.85)" fill="none" stroke="#DB2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="2,-11 -7,2 -1,2 -2,11 7,-2 1,-2"/></g>
<polyline points="160,195 260,195" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
