<rect x="505.48" y="167.0" width="59.040000000000006" height="22" rx="4" fill="#FFFFFF"/>
<text x="535" y="182.0" text-anchor="middle" font-size="12" fill="#111827">allowed</text>
<polyline points="330,150 330,70 95,70 95,160" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="133.44" y="59.0" width="153.12" height="22" rx="4" fill="#FFFFFF"/>
<text x="210" y="74.0" text-anchor="middle" font-size="12" fill="#111827">429 Too Many Requests</text>
<polyline points="300,240 300,290 215,290 215,340" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="390,240 390,290 485,290 485,340" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="30" y="435" text-anchor="start" font-size="13" fill="#4B5563">The limiter checks the rule, reads and updates the counter, then allows or rejects.</text>
</svg>
